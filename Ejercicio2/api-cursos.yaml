openapi: 3.0.3
info:
  title: API de Administración de Cursos Universitarios
  description: API para gestionar los cursos ofrecidos por una universidad.
  version: 1.0.0
servers:
  - url: http://localhost:8082
    description: Servidor local de desarrollo

tags:
  - name: Cursos
    description: Operaciones sobre cursos universitarios

paths:
  /api/cursos:
    post:
      tags: [Cursos]
      summary: Crear un nuevo curso
      operationId: crearCurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
            example:
              nombre: "Estructura de Datos"
              codigo: "CC-201"
              creditos: 4
              estado: "ACTIVO"
      responses:
        '201':
          description: Curso creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          description: Datos de la solicitud inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya existe un curso con el mismo código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Cursos]
      summary: Consultar todos los cursos
      operationId: consultarCursos
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtrar cursos por estado
          schema:
            $ref: '#/components/schemas/EstadoCurso'
      responses:
        '200':
          description: Listado de cursos obtenido exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CursoResponse'

  /api/cursos/{id}:
    put:
      tags: [Cursos]
      summary: Actualizar un curso existente
      operationId: actualizarCurso
      parameters:
        - $ref: '#/components/parameters/CursoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '400':
          description: Datos de la solicitud inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Cursos]
      summary: Eliminar un curso
      operationId: eliminarCurso
      parameters:
        - $ref: '#/components/parameters/CursoId'
      responses:
        '204':
          description: Curso eliminado exitosamente
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/cursos/codigo/{codigo}:
    get:
      tags: [Cursos]
      summary: Consultar un curso por código
      operationId: consultarCursoPorCodigo
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código único del curso
          schema:
            type: string
          example: "CC-201"
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoResponse'
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    CursoId:
      name: id
      in: path
      required: true
      description: Identificador único del curso
      schema:
        type: integer
        format: int64
      example: 1

  schemas:
    EstadoCurso:
      type: string
      description: Estado actual del curso
      enum: [ACTIVO, INACTIVO, CERRADO]

    CursoRequest:
      type: object
      required: [nombre, codigo, creditos, estado]
      properties:
        nombre:
          type: string
          example: "Estructura de Datos"
        codigo:
          type: string
          example: "CC-201"
        creditos:
          type: integer
          example: 4
        estado:
          $ref: '#/components/schemas/EstadoCurso'

    CursoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Estructura de Datos"
        codigo:
          type: string
          example: "CC-201"
        creditos:
          type: integer
          example: 4
        estado:
          $ref: '#/components/schemas/EstadoCurso'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Curso con código CC-201 no encontrado"
        path:
          type: string
          example: "/api/cursos/codigo/CC-201"
